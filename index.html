<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHut · Capacitación Pizza Hut El Salvador</title>
  <meta name="description" content="GameHut — Plataforma de minijuegos educativos para la capacitación de cocina de Pizza Hut El Salvador. Practica, aprende y domina tu cocina.">

  <!-- Favicon: logo GameHut (techo + control) desde assets/brand/ -->
  <link rel="icon" type="image/svg+xml" href="assets/brand/gamehut-icon.svg?v=20260826">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/gamehut-icon-32.png?v=20260826">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/brand/gamehut-icon-192.png?v=20260826">

  <!-- Tipografía Inter (estándar del proyecto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css?v=20260826">
</head>
<body>

  <!-- Ambiente de fondo (glows rojo y ámbar, solo decorativos) -->
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <!-- ============ HERO ============ -->
  <header class="hero wrap">
    <p class="kicker">Pizza Hut El Salvador · Capacitación</p>

    <!-- Logo GameHut — variante apilada (Chat 2): techo rojo + control de juego -->
    <div class="logo-hero" aria-hidden="true">
      <img src="assets/brand/gamehut-logo.svg?v=20260826" alt="GameHut" class="logo-hero-img">
    </div>

    <h1 class="titulo">GameHut</h1>
    <p class="tagline">Practica, aprende y domina tu cocina</p>
  </header>

  <!-- ============ ÁREAS DE CAPACITACIÓN ============ -->
  <main class="wrap">
    <section aria-labelledby="areas-label">
      <div class="section-head">
        <h2 id="areas-label" class="section-label">Áreas de capacitación</h2>
        <p class="section-hint">Elige un área para ver sus minijuegos</p>
      </div>

      <!-- Selector de áreas (tarjetas con imagen). main.js las genera desde la configuración. -->
      <div id="selector-areas" class="selector-areas" role="tablist" aria-label="Áreas de capacitación"></div>

      <!-- Panel de detalle: minijuegos del área seleccionada -->
      <div id="detalle-area" class="detalle-area" role="tabpanel" tabindex="0"></div>
    </section>

    <noscript>
      <div class="nojs">
        <p>Activa JavaScript para la experiencia completa. Acceso directo a los minijuegos:</p>
        <ul>
          <li><a href="minijuego-1.html">¿Qué hago ahora?</a></li>
          <li><a href="minijuego-2.html">¿Falta algo?</a></li>
          <li><a href="minijuego-3.html">El corte correcto</a></li>
          <li><a href="minijuego-4.html">El pedido llega</a></li>
          <li><a href="minijuego-5.html">Arma el producto</a></li>
        </ul>
      </div>
    </noscript>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    GameHut · Proyecto de portafolio personal · Diego Fuentes · Pizza Hut El Salvador · 2026
  </footer>

  <!-- Orden de carga importante: scores.js antes de main.js (main.js lee los récords) -->
  <script src="js/scores.js?v=20260826"></script>
  <script src="js/main.js?v=20260826"></script>
</body>
</html>
